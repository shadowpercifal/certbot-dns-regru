# Default usage

dns_regru_username=test
dns_regru_password=test

# Optional: client certificate (mTLS) for the Reg.ru API.
# Provide both cert and key, or a single PEM file in `cert`.
#dns_regru_cert=/path/to/client.crt
#dns_regru_key=/path/to/client.key

# Optional: DNS service type. Defaults to "domain".
# Use "srv_dns_both" for external domains managed via Reg.ru DNS hosting.
#dns_regru_servtype=domain
